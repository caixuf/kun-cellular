    dg = dy * dtanh * x * 1.5f;'
- id: 12
  name: SDSC_OP_DIFF
  category: METABOLIC
  description: '一阶时间差分/微分 (PD阻尼基石): out = x - s, s = x'
  has_state: true
  has_aux: false
  default_p1: 1.0
  default_p2: 0.0
  lyapunov_bound: '[-inf, +inf]'
  eval_code: 'out = x - s;

    s = x;

    '
  differentiable: true
  ste_gradient: none
  bounds:
    state:
    - -1000000000.0
    - 1000000000.0
    out:
    - -1000000000.0
    - 1000000000.0
    params:
      g:
      - 0.0
      - 4.0
  vjp_code: 'dx = dy + ds_next;

    ds_prev = -dy;

    da_prev = 0.0f;

    dg = 0.0f;'
- id: 13
  name: SDSC_OP_SUB
  category: METABOLIC
  description: '双均线差分剪刀差对比器: s = 0.60*s + 0.40*x, out = tanh((x - s) * g)'
  has_state: true
  has_aux: false
  default_p1: 1.0
  default_p2: 0.0
  lyapunov_bound: '[-1.0, 1.0]'
  eval_code: 's = s * 0.60f + x * 0.40f;

    out = tanhf((x - s) * g);

    '
  differentiable: true
  ste_gradient: none
  bounds:
    state:
    - -1000000000.0
    - 1000000000.0
    out:
    - -1.0
    - 1.0
    params:
      g:
      - 0.0
      - 4.0
  vjp_code: 'float dtanh = 1.0f - out * out;

    float du = dy * dtanh;

    float ds_local = -du * g;

    float ds_tot = ds_local + ds_next;

    dx = du * g + ds_tot * 0.40f;

    ds_prev = ds_tot * 0.60f;

    da_prev = 0.0f;

    dg = du * (x - s_next);'
- id: 14
  name: SDSC_OP_RATIO
  category: METABOLIC
  description: '相对比率有界归一化: s = 0.85*s + 0.15*|x|, out = clamp(x / (s + 0.1), -2.0, 2.0)'
  has_state: true
  has_aux: false
  default_p1: 1.0
  default_p2: 0.0
  lyapunov_bound: '[-2.0, 2.0]'
  eval_code: 's = s * 0.85f + fabsf(x) * 0.15f;

    out = fminf(fmaxf(x / (s + 0.1f), -2.0f), 2.0f);

    '
  differentiable: true
  ste_gradient: none
  bounds:
    state:
    - 0.0
    - 1000000000.0
    out:
    - -2.0
    - 2.0
    params:
      g:
      - 0.0
      - 4.0
  vjp_code: 'float denom = s_next + 0.1f;

    float u = x / denom;

    bool in_range = (u >= -2.0f && u <= 2.0f);

    float du = in_range ? dy : 0.0f;

    float sgn_x = (x > 0.0f) ? 1.0f : ((x < 0.0f) ? -1.0f : 0.0f);

    float ds_local = du * (-x / (denom * denom));

    float ds_tot = ds_local + ds_next;

    dx = du * (1.0f / denom) + ds_tot * 0.15f * sgn_x;

    ds_prev = ds_tot * 0.85f;

    da_prev = 0.0f;

    dg = 0.0f;'
- id: 15
  name: SDSC_OP_THRESHOLD
  category: GATING
  description: '三态阶跃硬门控: x > 0.25 -> 1.0; x < -0.25 -> -1.0; else 0.0'
  has_state: false
  has_aux: false
  default_p1: 1.0
  default_p2: 0.0
  lyapunov_bound: '[-1.0, 1.0]'
  eval_code: 'out = (x > 0.25f) ? 1.0f : ((x < -0.25f) ? -1.0f : 0.0f);'
  differentiable: false
  ste_gradient: straight_through
  bounds:
    state:
    - -1000000000.0
    - 1000000000.0
    out:
    - -1.0
    - 1.0
    params:
      g:
      - 0.0
      - 4.0
  vjp_code: 'dx = (fabsf(x) <= 1.0f) ? dy : 0.0f;

    ds_prev = 0.0f;

    da_prev = 0.0f;

    dg = 0.0f;'
- id: 16
  name: SDSC_OP_HYSTERESIS
  category: GATING
  description: '施密特双阈值迟滞抗抖门: x > 0.15 -> s=1; x < -0.15 -> s=-1; out = s'
  has_state: true
  has_aux: false
  default_p1: 1.0
  default_p2: 0.0
  lyapunov_bound: '[-1.0, 1.0]'
  eval_code: 'if (x > 0.15f) s = 1.0f;

    else if (x < -0.15f) s = -1.0f;

    out = s;

    '
  differentiable: false
  ste_gradient: straight_through
  bounds:
    state:
    - -1.0
    - 1.0
    out:
    - -1.0
    - 1.0
    params:
      g:
      - 0.0
      - 4.0
  vjp_code: 'dx = (fabsf(x) <= 1.0f) ? (dy * 0.5f) : 0.0f;

    ds_prev = ds_next * 0.90f;

    da_prev = 0.0f;

    dg = 0.0f;'
- id: 17
  name: SDSC_OP_DEADZONE
  category: GATING
  description: '中心死区微噪滤除门: |x| > 0.08 ? x*g : 0.0'
  has_state: false
  has_aux: false
  default_p1: 1.0
  default_p2: 0.0
  lyapunov_bound: '[-inf, +inf]'
  eval_code: 'out = (fabsf(x) > 0.08f) ? (x * g) : 0.0f;'
  differentiable: true
  ste_gradient: none
  bounds:
    state:
    - -1000000000.0
    - 1000000000.0
    out:
    - -1000000000.0
    - 1000000000.0
    params:
      g:
      - 0.0
      - 4.0
  vjp_code: 'bool active = (fabsf(x) > 0.08f);

    dx = active ? (dy * g) : 0.0f;

    ds_prev = 0.0f;

    da_prev = 0.0f;

    dg = active ? (dy * x) : 0.0f;'
- id: 18
  name: SDSC_OP_INHIBIT
  category: GATING
  description: '侧向抑制与能量闭锁: s = 0.80*s + 0.20*|x|, out = tanh(x*g) * max(0.0, 1.0 - s)'
  has_state: true
  has_aux: false
  default_p1: 1.0
  default_p2: 0.0
  lyapunov_bound: '[-1.0, 1.0]'
  eval_code: 's = s * 0.80f + fabsf(x) * 0.20f;

    out = tanhf(x * g) * fmaxf(0.0f, 1.0f - s);

    '
  differentiable: true
  ste_gradient: none
  bounds:
    state:
    - 0.0
    - 1000000000.0
    out:
    - -1.0
    - 1.0
    params:
      g:
      - 0.0
      - 4.0
  vjp_code: 'float tx = tanhf(x * g);

    float dtx = 1.0f - tx * tx;

    float gate = fmaxf(0.0f, 1.0f - s_next);

    float dgate = (1.0f - s_next > 0.0f) ? -1.0f : 0.0f;

    float ds_local = dy * tx * dgate;

    float ds_tot = ds_local + ds_next;

    float sgn_x = (x > 0.0f) ? 1.0f : ((x < 0.0f) ? -1.0f : 0.0f);

    dx = dy * gate * dtx * g + ds_tot * 0.20f * sgn_x;

    ds_prev = ds_tot * 0.80f;

    da_prev = 0.0f;

    dg = dy * gate * dtx * x;'
- id: 19
  name: SDSC_OP_AND
  category: GATING
  description: '时空协同兴奋与门: (x > 0 && s > 0) ? 1.0 : 0.0, s = x'
  has_state: true
  has_aux: false
  default_p1: 1.0
  default_p2: 0.0
  lyapunov_bound: '[0.0, 1.0]'
  eval_code: 'out = (x > 0.0f && s > 0.0f) ? 1.0f : 0.0f;

    s = x;

    '
  differentiable: false
  ste_gradient: straight_through
  bounds:
