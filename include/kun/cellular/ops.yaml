- id: 4
  name: SDSC_OP_SUM
  category: METABOLIC
  description: '非线性饱和加权叠加: tanh(x * g)'
  has_state: false
  has_aux: false
  default_p1: 1.0
  default_p2: 0.0
  lyapunov_bound: '[-1.0, 1.0]'
  eval_code: out = tanhf(x * g);
  differentiable: true
  ste_gradient: none
  bounds:
    state:
    - -1000000000.0
    - 1000000000.0
    out:
    - -1.0
    - 1.0
    params:
      g:
      - 0.0
      - 4.0
  vjp_code: 'float dtanh = 1.0f - out * out;

    dx = dy * dtanh * g;

    ds_prev = 0.0f;

    da_prev = 0.0f;

    dg = dy * dtanh * x;'
- id: 5
  name: SDSC_OP_INTEGRATE
  category: METABOLIC
  description: '稳态误差积分累加器 (Leaky Integrator): s = 0.85*s + 0.15*x, out = tanh(s * g)'
  has_state: true
  has_aux: false
  default_p1: 1.0
  default_p2: 0.0
  lyapunov_bound: '[-1.0, 1.0]'
  eval_code: 's = s * 0.85f + x * 0.15f;

    out = tanhf(s * g);

    '
  differentiable: true
  ste_gradient: none
  bounds:
    state:
    - -4.0
    - 4.0
    out:
    - -1.0
    - 1.0
    params:
      g:
      - 0.0
      - 4.0
  vjp_code: 'float dtanh = 1.0f - out * out;

    float ds_local = dy * dtanh * g;

    float ds_tot = ds_local + ds_next;

    dx = ds_tot * 0.15f;

    ds_prev = ds_tot * 0.85f;

    da_prev = 0.0f;

    dg = dy * dtanh * s_next;'
- id: 6
  name: SDSC_OP_AMPLIFY
  category: METABOLIC
  description: '敏捷高增益兴奋门: tanh(x * g * 2.5)'
  has_state: false
  has_aux: false
  default_p1: 1.0
  default_p2: 0.0
  lyapunov_bound: '[-1.0, 1.0]'
  eval_code: out = tanhf(x * g * 2.5f);
  differentiable: true
  ste_gradient: none
  bounds:
    state:
    - -1000000000.0
    - 1000000000.0
    out:
    - -1.0
    - 1.0
    params:
      g:
      - 0.0
      - 4.0
  vjp_code: 'float dtanh = 1.0f - out * out;

    dx = dy * dtanh * g * 2.5f;

    ds_prev = 0.0f;

    da_prev = 0.0f;

    dg = dy * dtanh * x * 2.5f;'
- id: 7
  name: SDSC_OP_INVERT
  category: METABOLIC
  description: '反相负反馈抑制门: -tanh(x * g)'
  has_state: false
  has_aux: false
  default_p1: 1.0
  default_p2: 0.0
  lyapunov_bound: '[-1.0, 1.0]'
  eval_code: out = -tanhf(x * g);
  differentiable: true
  ste_gradient: none
  bounds:
    state:
    - -1000000000.0
    - 1000000000.0
    out:
    - -1.0
    - 1.0
    params:
      g:
      - 0.0
      - 4.0
  vjp_code: 'float dtanh = 1.0f - out * out;

    dx = -dy * dtanh * g;

    ds_prev = 0.0f;

    da_prev = 0.0f;

    dg = -dy * dtanh * x;'
- id: 8
  name: SDSC_OP_DAMPER
  category: METABOLIC
  description: '惯性一阶低通阻尼滤波: s = 0.70*s + 0.30*x, out = s'
  has_state: true
  has_aux: false
  default_p1: 1.0
  default_p2: 0.0
  lyapunov_bound: '[-inf, +inf] (asymptotically bounded)'
  eval_code: 's = s * 0.70f + x * 0.30f;

    out = s;

    '
  differentiable: true
  ste_gradient: none
  bounds:
    state:
    - -1000000000.0
    - 1000000000.0
    out:
    - -1000000000.0
    - 1000000000.0
    params:
      g:
      - 0.0
      - 4.0
  vjp_code: 'float ds_tot = dy + ds_next;

    dx = ds_tot * 0.30f;

    ds_prev = ds_tot * 0.70f;

    da_prev = 0.0f;

    dg = 0.0f;'
- id: 9
  name: SDSC_OP_CLIP
  category: METABOLIC
  description: '区间硬饱和截断: clamp(x * g, -1.0, 1.0)'
  has_state: false
  has_aux: false
  default_p1: 1.0
  default_p2: 0.0
  lyapunov_bound: '[-1.0, 1.0]'
  eval_code: out = fminf(fmaxf(x * g, -1.0f), 1.0f);
  differentiable: true
  ste_gradient: none
  bounds:
    state:
    - -1000000000.0
    - 1000000000.0
    out:
    - -1.0
    - 1.0
    params:
      g:
      - 0.0
      - 4.0
  vjp_code: 'float u = x * g;

    bool in_range = (u >= -1.0f && u <= 1.0f);

    dx = in_range ? (dy * g) : 0.0f;

    ds_prev = 0.0f;

    da_prev = 0.0f;

    dg = in_range ? (dy * x) : 0.0f;'
- id: 10
  name: SDSC_OP_ABS
  category: METABOLIC
  description: '绝对值全波整流能量提取: |tanh(x * g)|'
  has_state: false
  has_aux: false
  default_p1: 1.0
  default_p2: 0.0
  lyapunov_bound: '[0.0, 1.0]'
  eval_code: out = fabsf(tanhf(x * g));
  differentiable: true
  ste_gradient: none
  bounds:
    state:
    - -1000000000.0
    - 1000000000.0
    out:
    - 0.0
    - 1.0
    params:
      g:
      - 0.0
      - 4.0
  vjp_code: 'float tx = tanhf(x * g);

    float sgn = (tx > 0.0f) ? 1.0f : ((tx < 0.0f) ? -1.0f : 0.0f);

    float dtanh = 1.0f - tx * tx;

    dx = dy * sgn * dtanh * g;

    ds_prev = 0.0f;

    da_prev = 0.0f;

    dg = dy * sgn * dtanh * x;'
- id: 11
  name: SDSC_OP_MULTIPLY
  category: METABOLIC
  description: '二阶非线性增益调制: tanh(x * g * 1.5)'
  has_state: false
  has_aux: false
  default_p1: 1.0
  default_p2: 0.0
  lyapunov_bound: '[-1.0, 1.0]'
  eval_code: out = tanhf(x * g * 1.5f);
  differentiable: true
