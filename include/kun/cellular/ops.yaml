- id: 14
  name: SDSC_OP_RATIO
  category: METABOLIC
  description: '相对比率有界归一化: s = 0.85*s + 0.15*|x|, out = clamp(x / (s + 0.1), -2.0, 2.0)'
  has_state: true
  has_aux: false
  default_p1: 1.0
  default_p2: 0.0
  lyapunov_bound: '[-2.0, 2.0]'
  eval_code: 'float next_s = s * 0.85f + fabsf(x) * 0.15f;

    SDSC_STRICT_CHECK_FINITE(next_s);

    s = next_s;

    float denominator = s + 0.1f;

    SDSC_STRICT_CHECK_FINITE(denominator);

    SDSC_STRICT_CHECK_NONZERO(denominator);

    float ratio = x / denominator;

    SDSC_STRICT_CHECK_FINITE(ratio);

    out = fminf(fmaxf(ratio, -2.0f), 2.0f);

    '
  differentiable: true
  ste_gradient: none
  bounds:
    state:
    - 0.0
    - 1000000000.0
    out:
    - -2.0
    - 2.0
    params:
      g:
      - 0.0
      - 4.0
  vjp_code: 'float denom = s_next + 0.1f;

    float u = x / denom;

    bool in_range = (u >= -2.0f && u <= 2.0f);

    float du = in_range ? dy : 0.0f;

    float sgn_x = (x > 0.0f) ? 1.0f : ((x < 0.0f) ? -1.0f : 0.0f);

    float ds_local = du * (-x / (denom * denom));

    float ds_tot = ds_local + ds_next;

    dx = du * (1.0f / denom) + ds_tot * 0.15f * sgn_x;

    ds_prev = ds_tot * 0.85f;

    da_prev = 0.0f;

    dg = 0.0f;'
