  vjp_code: 'dx = dy;

    ds_prev = 0.0f;

    da_prev = 0.0f;

    dg = 0.0f;'
- id: 24
  name: SDSC_OP_CORRELATION
  category: COGNITIVE
  description: '时空自相关注意力核: s = 0.90*s + (x*a)*0.10, a = x, out = tanh(s * g)'
  has_state: true
  has_aux: true
  default_p1: 1.0
  default_p2: 0.0
  lyapunov_bound: '[-1.0, 1.0]'
  eval_code: 's = s * 0.90f + (x * a) * 0.10f;

    a = x;

    out = tanhf(s * g);

    '
  differentiable: true
  ste_gradient: none
  bounds:
    state:
    - -1.0
    - 1.0
    out:
    - -1.0
    - 1.0
    params:
      g:
      - 0.0
      - 4.0
  vjp_code: 'float dtanh = 1.0f - out * out;

    float ds_local = dy * dtanh * g;

    float ds_tot = ds_local + ds_next;

    dx = ds_tot * (a * 0.10f) + da_next;

    da_prev = ds_tot * (x * 0.10f);

    ds_prev = ds_tot * 0.90f;

    dg = dy * dtanh * s_next;'
- id: 25
  name: SDSC_OP_FATIGUE
  category: COGNITIVE
  description: '神经元代谢适应疲劳门: s = min(2.0, s + |x|*0.15)*0.96, out = tanh(x*g) / (1.0 + s)'
  has_state: true
  has_aux: false
  default_p1: 1.0
  default_p2: 0.0
  lyapunov_bound: '[-1.0, 1.0]'
  eval_code: 's = fminf(2.0f, s + fabsf(x) * 0.15f) * 0.96f;

    out = tanhf(x * g) / (1.0f + s);

    '
  differentiable: true
  ste_gradient: none
  bounds:
    state:
    - 0.0
    - 2.0
    out:
    - -1.0
    - 1.0
    params:
      g:
      - 0.0
      - 4.0
  vjp_code: 'float tx = tanhf(x * g);

    float dtx = 1.0f - tx * tx;

    float denom = 1.0f + s_next;

    float ds_local = -dy * tx / (denom * denom);

    float ds_tot = ds_local + ds_next;

    float s_raw = s + fabsf(x) * 0.15f;

    float dclamp = (s_raw < 2.0f) ? 0.96f : 0.0f;

    float sgn_x = (x > 0.0f) ? 1.0f : ((x < 0.0f) ? -1.0f : 0.0f);

    dx = dy * (dtx * g / denom) + ds_tot * dclamp * 0.15f * sgn_x;

    ds_prev = ds_tot * dclamp;

    da_prev = 0.0f;

    dg = dy * (dtx * x / denom);'
- id: 26
  name: SDSC_OP_PASSTHRU
  category: PASSTHRU
  description: '直通透传通道: out = x'
  has_state: false
  has_aux: false
  default_p1: 1.0
  default_p2: 0.0
  lyapunov_bound: '[-inf, +inf]'
  eval_code: out = x;
  differentiable: true
  ste_gradient: none
  bounds:
    state:
    - -1000000000.0
    - 1000000000.0
    out:
    - -1000000000.0
    - 1000000000.0
    params:
      g:
      - 0.0
      - 4.0
  vjp_code: 'dx = dy;

    ds_prev = 0.0f;

    da_prev = 0.0f;

    dg = 0.0f;'
