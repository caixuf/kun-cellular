- id: 5
  name: SDSC_OP_INTEGRATE
  category: METABOLIC
  description: '稳态误差积分累加器 (Leaky Integrator): s = 0.85*s + 0.15*x, out = tanh(s * g)'
  has_state: true
  has_aux: false
  default_p1: 1.0
  default_p2: 0.0
  lyapunov_bound: '[-1.0, 1.0]'
  eval_code: 'float next_s = s * 0.85f + x * 0.15f;

    SDSC_STRICT_CHECK_FINITE(next_s);

    s = next_s;

    float drive = s * g;

    SDSC_STRICT_CHECK_FINITE(drive);

    out = tanhf(drive);

    '
  differentiable: true
  ste_gradient: none
  bounds:
    state:
    - -4.0
    - 4.0
    out:
    - -1.0
    - 1.0
    params:
      g:
      - 0.0
      - 4.0
  vjp_code: 'float dtanh = 1.0f - out * out;

    float ds_local = dy * dtanh * g;

    float ds_tot = ds_local + ds_next;

    dx = ds_tot * 0.15f;

    ds_prev = ds_tot * 0.85f;

    da_prev = 0.0f;

    dg = dy * dtanh * s_next;'
- id: 6
