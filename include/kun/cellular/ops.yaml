      - 4.0
  vjp_code: 'float u = -x * g;

    bool in_range = (u >= 0.0f && u <= 1.0f);

    dx = in_range ? (-dy * g) : 0.0f;

    ds_prev = 0.0f;

    da_prev = 0.0f;

    dg = in_range ? (-dy * x) : 0.0f;'
- id: 23
  name: SDSC_OP_ACT_RESET
  category: EFFECTOR
  description: '防御性归零复位门: |x| < 0.10 ? 0.0 : x'
  has_state: false
