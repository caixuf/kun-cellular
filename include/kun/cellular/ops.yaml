  description: 原始输入通道 0 (透传直连)
  has_state: false
  has_aux: false
  default_p1: 1.0
  default_p2: 0.0
  lyapunov_bound: '[-inf, +inf]'
  eval_code: out = x;
  differentiable: true
  ste_gradient: none
  bounds:
    state:
    - -1000000000.0
    - 1000000000.0
    out:
    - -1000000000.0
    - 1000000000.0
    params:
      g:
      - 0.0
      - 4.0
  vjp_code: 'dx = dy;

    ds_prev = 0.0f;

    da_prev = 0.0f;

    dg = 0.0f;'
