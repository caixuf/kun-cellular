    out:
    - 0.0
    - 1.0
    params:
      g:
      - 0.0
      - 4.0
  vjp_code: 'dx = dy * 0.5f + ds_next;

    ds_prev = dy * 0.5f;

    da_prev = 0.0f;

    dg = 0.0f;'
- id: 20
  name: SDSC_OP_MIN_MAX
  category: GATING
  description: '时序极值包络提取门: out = max(x, s), s = x'
  has_state: true
  has_aux: false
  default_p1: 1.0
  default_p2: 0.0
  lyapunov_bound: '[-inf, +inf]'
  eval_code: 'out = fmaxf(x, s);

    s = x;

    '
  differentiable: true
  ste_gradient: none
  bounds:
    state:
    - -1000000000.0
    - 1000000000.0
    out:
    - -1000000000.0
    - 1000000000.0
    params:
      g:
      - 0.0
      - 4.0
  vjp_code: 'dx = ((x >= s) ? dy : 0.0f) + ds_next;

    ds_prev = (x < s) ? dy : 0.0f;

    da_prev = 0.0f;

    dg = 0.0f;'
- id: 21
  name: SDSC_OP_ACT_POS
  category: EFFECTOR
  description: '正向单极性执行器: clamp(x * g, 0.0, 1.0)'
  has_state: false
  has_aux: false
