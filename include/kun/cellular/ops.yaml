    '
- id: 18
  name: SDSC_OP_INHIBIT
  category: GATING
  description: '侧向抑制与能量闭锁: s = 0.80*s + 0.20*|x|, out = tanh(x*g) * max(0.0, 1.0 - s)'
  has_state: true
  has_aux: false
  default_p1: 1.0
  default_p2: 0.0
  lyapunov_bound: '[-1.0, 1.0]'
  eval_code: 'float next_s = s * 0.80f + fabsf(x) * 0.20f;

    SDSC_STRICT_CHECK_FINITE(next_s);

    s = next_s;

    float drive = x * g;

    SDSC_STRICT_CHECK_FINITE(drive);

    float remaining = fmaxf(0.0f, 1.0f - s);

    SDSC_STRICT_CHECK_FINITE(remaining);

    float gated = tanhf(drive) * remaining;

    SDSC_STRICT_CHECK_FINITE(gated);

    out = gated;

    '
  differentiable: true
  ste_gradient: none
  bounds:
    state:
    - 0.0
    - 1000000000.0
    out:
    - -1.0
    - 1.0
    params:
      g:
      - 0.0
      - 4.0
  vjp_code: 'float tx = tanhf(x * g);

    float dtx = 1.0f - tx * tx;

    float gate = fmaxf(0.0f, 1.0f - s_next);

    float dgate = (1.0f - s_next > 0.0f) ? -1.0f : 0.0f;

    float ds_local = dy * tx * dgate;

    float ds_tot = ds_local + ds_next;

    float sgn_x = (x > 0.0f) ? 1.0f : ((x < 0.0f) ? -1.0f : 0.0f);

    dx = dy * gate * dtx * g + ds_tot * 0.20f * sgn_x;

    ds_prev = ds_tot * 0.80f;

    da_prev = 0.0f;

    dg = dy * gate * dtx * x;'
- id: 19
