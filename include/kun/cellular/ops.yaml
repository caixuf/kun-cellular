  vjp_code: 'float dtanh = 1.0f - out * out;

    dx = dy * dtanh * g * 2.5f;

    ds_prev = 0.0f;

    da_prev = 0.0f;

    dg = dy * dtanh * x * 2.5f;'
- id: 7
