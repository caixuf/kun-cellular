name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Python Dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip install numpy pytest pyyaml
        pip install torch --extra-index-url https://download.pytorch.org/whl/cpu

    - name: Prepare ephemeral test dirs
      run: mkdir -p /tmp/opencode

    - name: Generate Scaled Checkpoint
      run: |
        python3 tools/export_sdsc_binary.py

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build Tests
      run: cmake --build build --config Release -j$(nproc)

    - name: Run CTest
      run: ctest --test-dir build --output-on-failure

    - name: Assert DouDiZhu I1-I3 required gate
      if: success() || failure()
      run: |
        test -x build/test_doudizhu_invariants
        ./build/test_doudizhu_invariants

    - name: Run Substrate Purity Guard
      run: python3 tools/ci/check_substrate_purity.py

    - name: Run Architectural Discipline & Binary LOD Guard
      run: python3 tools/ci/check_architecture_discipline.py

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"

    - name: Run Frontend Syntax & Asset Check
      run: python3 tools/ci/check_frontend.py

    - name: Run Python Parity & System Gate Tests
      run: |
        pytest tests/ -v
        python3 tests/test_gate5_gate6_replay_shadow.py

  # Phase 1 Correctness — 8k illegal+agree REQUIRED (not continue-on-error)
  doudizhu-wasm-probe:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"

    - name: Assert committed WASM artifacts present
      run: |
        test -f frontend/wasm/doudizhu_rules.wasm
        test -f frontend/wasm/doudizhu_rules.js
        test -f frontend/doudizhu_wasm_glue.js

    - name: 8k illegal + agree probe (fail if illegal_rate > 0.1% or disagree)
      run: |
        mkdir -p runs
        node tools/bench_doudizhu_wasm_probe.mjs 20261024 8000 | tee runs/doudizhu_wasm_probe.json
        python3 -c "import json,sys; d=json.load(open(\"runs/doudizhu_wasm_probe.json\")); print(d); sys.exit(0 if d.get(\"illegal_rate\",1)<=0.001 and d.get(\"disagree_n\")==0 and d.get(\"sum_mismatch\")==0 and d.get(\"pass_p1\") and d.get(\"pass_p2\") else 1)"

  # W1b Harden Prefer A — frozen champ multi-family Pack S + T4 (A1/A4–A7)
  w1b-harden-repro:
    # Evidence-only: HARDEN_FAIL (F1) must not block required green on main
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: A1 assert frozen champ md5
      run: |
        expected=ea8e68269b24ed578070738a99441d83
        got=$(md5sum checkpoints/cartpole_balance_champion.bin | awk '{print $1}')
        echo "champ md5=$got"
        test "$got" = "$expected"

    - name: Build harden bench
      run: |
        mkdir -p build runs
        g++ -O3 -march=native -std=c++20 -I include -I . \
          tools/bench_cartpole_vs_pd_harden.cpp \
          -o build/bench_cartpole_vs_pd_harden -pthread -lm

    - name: Run harden bench (fail on A1/A4–A7 miss)
      run: |
        ./build/bench_cartpole_vs_pd_harden \
          --bin checkpoints/cartpole_balance_champion.bin \
          --out runs/cartpole_vs_pd_harden.json
